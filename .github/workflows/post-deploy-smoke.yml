name: Post-deploy smoke tests

# Vercel sends repository_dispatch on deploy success. deployment_status is too noisy:
# GitHub Pages and pending/preview events create skipped runs that look like failures.
on:
  repository_dispatch:
    types:
      - vercel.deployment.success
  workflow_dispatch:
    inputs:
      base_url:
        description: URL to test
        default: https://soumitraghosh.in

jobs:
  smoke:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.client_payload.environment != 'preview'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_URL: ${{ github.event.inputs.base_url || github.event.client_payload.url || 'https://soumitraghosh.in' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.client_payload.git.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm install --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:smoke
      - name: Email sanity results
        if: always()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ vars.RESEND_FROM }}
          RESEND_TO: ${{ vars.RESEND_TO }}
          REQUIRE_SMOKE_EMAIL: '1'
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: npm run email:smoke
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: smoke-traces
          path: test-results/
