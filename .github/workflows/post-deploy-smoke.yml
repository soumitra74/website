name: Post-deploy smoke tests

# Triggered by Vercel after a successful deployment. Preview events are skipped below.
on:
  repository_dispatch:
    types:
      - vercel.deployment.success
  workflow_dispatch:
    inputs:
      base_url:
        description: URL to test
        default: https://about.soumitraghosh.in

jobs:
  smoke:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.client_payload.environment != 'preview'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_URL: ${{ github.event.inputs.base_url || github.event.client_payload.url || 'https://about.soumitraghosh.in' }}
    steps:
      # Checkout the default branch (this workflow), not the Vercel SHA.
      # Smoke tests hit BASE_URL; the runner must have the latest email script and lockfile.
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:smoke
      - name: Email sanity results
        if: always()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ vars.RESEND_FROM }}
          RESEND_TO: ${{ vars.RESEND_TO }}
          REQUIRE_SMOKE_EMAIL: '1'
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: npm run email:smoke
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: smoke-traces
          path: test-results/
